resources:
  jobs:
    coingecko_ingestion:
      name: "CoinGecko - Ingestão API para Raw"

      schedule:
        quartz_cron_expression: "0 0 8 * * ?"  # Diário às 8h (horário Brasília)
        timezone_id: "America/Sao_Paulo"
        pause_status: UNPAUSED

      tasks:
        - task_key: api_to_raw
          spark_python_task:
            python_file: ../src/coingecko/ingestion/api_to_raw.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - requests>=2.32
              - pandas>=2.2
