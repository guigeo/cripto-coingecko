resources:
  jobs:
    coingecko_ingestion:
      name: "CoinGecko - Ingestão API para Raw"

      schedule:
        quartz_cron_expression: "0 0 8 * * ?"  # Diário às 8h (horário Brasília)
        timezone_id: "America/Sao_Paulo"
        pause_status: UNPAUSED

      tasks:
        - task_key: api_to_raw
          notebook_task:
            notebook_path: ../notebooks/run_api_to_raw.py

        - task_key: dlt_pipeline
          depends_on:
            - task_key: api_to_raw
          pipeline_task:
            pipeline_id: ${resources.pipelines.coingecko_dlt.id}
