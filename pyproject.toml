[project]
name = "coingecko"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "databricks-sdk>=0.30",
    "databricks-connect>=15.4",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "ipykernel",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
